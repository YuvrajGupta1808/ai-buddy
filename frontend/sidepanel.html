<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Buddy</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Buddy</h1>
      <p class="subtitle">Your AI Assistant</p>
    </header>
    
    <div class="quick-actions">
      <button id="summarizeBtn" class="quick-action-btn" title="Summarize">
        <span class="icon">📝</span>
        <span>Summarize</span>
      </button>
      <button id="translateBtn" class="quick-action-btn" title="Translate">
        <span class="icon">🌐</span>
        <span>Translate</span>
      </button>
      <button id="searchBtn" class="quick-action-btn" title="Web Search">
        <span class="icon">🔍</span>
        <span>Search</span>
      </button>
    </div>
    
    <div class="content">
      <div id="chatSection" class="chat-section">
        <div id="chatMessages" class="chat-messages">
          <div class="welcome-message">
            <div class="welcome-icon">✨</div>
            <h3>Welcome to AI Buddy!</h3>
            <p>I can help you summarize, translate, search the web, or chat about anything. What would you like to do?</p>
          </div>
        </div>
      </div>
      
      <div id="loadingSection" class="loading-overlay hidden">
        <div class="loading-container">
          <div class="spinner"></div>
          <p class="loading-text">AI is thinking...</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Fixed chat input at bottom -->
  <div id="chatInputContainer" class="chat-input-container">
    <div class="chat-input-wrapper">
      <textarea 
        id="chatInput" 
        class="chat-input" 
        placeholder="Type your message or ask AI Buddy..."
        rows="1"></textarea>
      <button id="sendChatBtn" class="send-btn" title="Send message">
        <span class="icon">➤</span>
      </button>
    </div>
  </div>
  
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
